[package]
name = "inotify-info-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
regex = "1.11"
nix = { version = "0.30", features = ["fs", "user"] }
colored = "3.0"

[dev-dependencies]
nix = { version = "0.30", features = ["fs", "user", "inotify"] }
